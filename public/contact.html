<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us - DevBlog</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f8f9fa; }
    nav { background: #2c3e50; padding: 15px 30px; display: flex; justify-content: space-between; }
    nav a { color: #ecf0f1; text-decoration: none; margin: 0 12px; }
    .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #27ae60; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
  </style>
</head>
<body>
  <nav>
    <div style="font-size: 20px; font-weight: bold; color: white;">DevBlog</div>
    <div>
      <a href="/">Home</a>
      <a href="/blogs.html">Blogs</a>
      <a href="/about.html">About Us</a>
      <a href="/contact.html">Contact Us</a>
      <a href="/admin.html">Admin Panel</a>
    </div>
  </nav>

  <div class="container">
    <h1>Contact Us</h1>
    <form onsubmit="event.preventDefault(); alert('Thank you! Your message has been sent.');">
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea rows="5" placeholder="Your Message" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>
</body>
</html>
