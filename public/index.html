<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Platform - Home</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; color: #333; }
    nav { background: #2c3e50; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
    nav a { color: #ecf0f1; text-decoration: none; margin: 0 12px; font-weight: 500; }
    nav a:hover { color: #3498db; }
    .hero { background: #34495e; color: white; text-align: center; padding: 50px 20px; }
    .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .blog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; }
    .card h3 { margin-top: 0; color: #2c3e50; }
    .card p { color: #666; line-height: 1.5; }
    .btn { display: inline-block; background: #3498db; color: white; padding: 8px 16px; border-radius: 4px; text-decoration: none; margin-top: 10px; text-align: center; }
    footer { text-align: center; padding: 20px; background: #2c3e50; color: white; margin-top: 40px; }
  </style>
</head>
<body>
  <nav>
    <div style="font-size: 20px; font-weight: bold; color: white;">DevBlog</div>
    <div>
      <a href="/">Home</a>
      <a href="/blogs.html">Blogs</a>
      <a href="/about.html">About Us</a>
      <a href="/contact.html">Contact Us</a>
      <a href="/admin.html" style="background: #e74c3c; padding: 6px 12px; border-radius: 4px;">Admin Panel</a>
    </div>
  </nav>

  <div class="hero">
    <h1>Welcome to Our Modern Blog System</h1>
    <p>Discover articles on software architecture, design patterns, and web development.</p>
  </div>

  <div class="container">
    <h2>Featured Articles</h2>
    <div class="blog-grid" id="featuredBlogs">Loading articles...</div>
  </div>

  <footer>
    <p>&copy; 2026 DevBlog System. Built with Clean Architecture.</p>
  </footer>

  <script>
    async function fetchFeatured() {
      try {
        const res = await fetch('/api/blogs');
        const blogs = await res.json();
        const container = document.getElementById('featuredBlogs');
        if (!blogs.length) {
          container.innerHTML = '<p>No blog posts found yet.</p>';
          return;
        }
        container.innerHTML = blogs.slice(0, 6).map(b => `
          <div class="card">
            <div>
              <h3>${b.title}</h3>
              <p>${b.content.substring(0, 120)}...</p>
            </div>
            <a class="btn" href="/blog.html?id=${b._id}">Read Full Article</a>
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('featuredBlogs').innerHTML = '<p>Error loading blogs.</p>';
      }
    }
    fetchFeatured();
  </script>
</body>
</html>
